[project]
name = "rsatb"
version = "0.1.0"
description = "A random state method for abinitio tight-binding calculations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "ase",
    "mpi4py"
]

[build-system]
requires = ["scikit-build-core>=0.5", "pybind11>=2.10", "mpi4py", "fypp"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# Python package location
wheel.packages = ["rsatb"]

# CMake configuration
cmake.source-dir = "rsatb"
cmake.build-type = "Release"
cmake.args = [
    "-DUSE_OPENMP=ON",
    "-DBLAS_BACKEND=Generic",
]

# Install the built extension module
wheel.install-dir = "rsatb"

# Build directory (relative to source)
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
# Pass any CMake defines here if needed

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-order>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]