[project]
name = "rsatb"
version = "0.1.0"
description = "A random state method for ab initio tight-binding calculations"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Zhanghao Zhouyin"},
]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "ase",
    "mpi4py"
]

[project.scripts]
rsatb = "rsatb.cli:main"

[project.urls]
Repository = "https://github.com/floatingCatty/rsatb"
Issues = "https://github.com/floatingCatty/rsatb/issues"

[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.10", "mpi4py"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# Python package location
wheel.packages = ["rsatb"]

# CMake configuration
cmake.source-dir = "rsatb"
cmake.build-type = "Release"
cmake.args = [
    "-DUSE_OPENMP=ON",
    "-DBLAS_BACKEND=Auto", # Auto, MKL, OpenBLAS or Generic
]

# Install the built extension module
wheel.install-dir = "rsatb"

# Build directory (relative to source)
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
# Pass any CMake defines here if needed

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5",
]
examples = [
    "matplotlib>=3.5",
]
dev = [
    "matplotlib>=3.5",
    "pytest>=7.2.0",
    "pytest-order>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
# The remaining test_*.py files are intentionally executable research/scale
# drivers, not pytest modules; importing them would launch full calculations
# during collection.
python_files = [
    "test_binding.py",
    "test_json_input.py",
    "test_supercell_bonds.py",
    "test_transport_scale.py",
]
markers = [
    "mpi: needs MPI initialized (import mpi4py); skipped where it is not available",
]
